<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jokenpô Balloon Clash</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div class="clouds"></div><main>
<section id="home" class="screen active"><div class="logo"><span>JOKENPÔ</span><strong>BALLOON<br>CLASH!</strong></div><div class="card"><div class="score-title"><span>🏆</span><div><small>GALERIA DOS CAMPEÕES</small><h2>PLACAR</h2></div></div><ol id="homeBoard"></ol><label for="playerName">SEU NOME</label><input id="playerName" maxlength="14" placeholder="DIGITE AQUI" autocomplete="off"><button id="playBtn">JOGAR AGORA <b>▶</b></button><p class="hint">Use <kbd>1</kbd> Pedra · <kbd>2</kbd> Papel · <kbd>3</kbd> Tesoura</p></div></section>
<section id="game" class="screen"><div class="hud"><div><small>PONTOS</small><strong id="score">0000</strong></div><div class="level"><small>NÍVEL</small><strong id="level">1</strong></div></div><div id="arena"><div class="center-line"></div><div id="danger"><span>LINHA DE PERIGO</span></div><div id="message"></div></div><div class="controls"><button data-move="rock"><kbd>1</kbd><span>✊</span><b>PEDRA</b></button><button data-move="paper"><kbd>2</kbd><span>✋</span><b>PAPEL</b></button><button data-move="scissors"><kbd>3</kbd><span>✌️</span><b>TESOURA</b></button></div></section>
<section id="over" class="screen"><div class="over-card"><p>FIM DE JOGO</p><h2>UM BALÃO<br>ESCAPOU!</h2><div class="final"><small>PONTUAÇÃO FINAL</small><strong id="finalScore">0</strong></div><div class="run-stats"><span>NÍVEL <b id="finalLevel">1</b></span><span>ESTOURADOS <b id="popped">0</b></span></div><h3>PLACAR</h3><ol id="finalBoard"></ol><button id="againBtn">JOGAR NOVAMENTE ↻</button></div></section>
</main><script src="game.js"></script></body></html>
